name: Deploy to Cloudflare Workers

# Cloudflare's own build machine is capped at 2 vCPU and 20 minutes per build, which is not enough
# to compile this Next.js application. GitHub-hosted runners provide 4 vCPU / 16 GB without that
# cap, so the build runs here and only the finished Worker is handed over to Cloudflare.
on:
  push:
    branches:
      - cloudflare-workers
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      WRANGLER_SEND_METRICS: "false"
      # Build-time configuration. `setup-cloudflare.ts` also uses the Cloudflare credentials to run
      # migrations and to auto-provision the KV / R2 / Queue resources before the Worker is deployed.
      # Migrations fall back to DATABASE_URL, so no separate migration URL is needed.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
      BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      LOG_LEVEL: ${{ secrets.LOG_LEVEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js (version from .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.platform=linux --config.architecture=x64

      # `apps/web/.env` is a tracked symlink to the repository-root `.env`, which stays untracked.
      # Materialize the target so the symlink resolves on a fresh clone.
      - name: Ensure root .env exists
        run: touch .env

      # Turbopack keeps an incremental build cache in `.next/cache`. Restoring it means a rebuild
      # only recompiles what actually changed instead of the entire application.
      - name: Restore Next.js build cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Builds the workspace packages, runs migrations, auto-provisions Cloudflare resources and
      # produces the OpenNext bundle in apps/web/.open-next.
      - name: Build Worker
        working-directory: apps/web
        run: pnpm build:cf:full

      - name: Deploy Worker
        working-directory: apps/web
        run: pnpm deploy:cf

      # Worker runtime variables live in Cloudflare, so keep them in sync with the repository
      # secrets above. Values that are not configured are skipped.
      - name: Sync Worker runtime secrets
        working-directory: apps/web
        run: |
          set -euo pipefail
          for key in DATABASE_URL WEBAPP_URL BETTER_AUTH_URL BETTER_AUTH_SECRET ENCRYPTION_KEY CRON_SECRET LOG_LEVEL; do
            value="${!key:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | pnpm exec wrangler secret put "$key"
              echo "Synced $key"
            else
              echo "Skipped $key (not configured)"
            fi
          done
