name: Deploy to Cloudflare Workers

# Builds the OpenNext Worker on a GitHub-hosted runner and pushes it straight into the *existing*
# `formbricks-worker` Worker with `wrangler deploy`, so Cloudflare Workers Builds never has to
# compile the app again (its 2 vCPU / 20-minute builder was taking ~22 minutes for this repo).
#
# The Worker is addressed purely by the `name` in `apps/web/wrangler.jsonc`; nothing here creates a
# new project or re-binds anything. `scripts/setup-cloudflare.ts` looks the KV namespaces, the R2
# bucket and the queue up by title and reuses them when they already exist, then rewrites the
# placeholder ids in `wrangler.jsonc` with the real ones before the deploy.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   - token with Workers Scripts: Edit + Workers KV: Edit + R2: Edit + Queues: Edit
#   CLOUDFLARE_ACCOUNT_ID  - the account that owns the Worker
#   ENV_FILE               - the whole Formbricks `.env` (every variable below is optional except
#                            WEBAPP_URL, DATABASE_URL, ENCRYPTION_KEY and BETTER_AUTH_SECRET)
on:
  push:
    branches:
      - cloudflare-workers
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight deploy for the same branch rather than racing it.
concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy worker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Same switches as apps/web's `build:cf*` scripts. workerd cannot host the Node OpenTelemetry
      # SDK, and the tsc pass does not change the emitted bundle; together they used to dominate the
      # build.
      FORMBRICKS_OTEL_ENABLED: "0"
      FORMBRICKS_SKIP_TYPECHECK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js (version from .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      # Turborepo's local cache, so a re-deploy only rebuilds the workspace packages that changed.
      - name: Restore Turbo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      # Next's incremental build cache. `next.config.mjs` enables
      # `turbopackFileSystemCacheForBuild`, so restoring this is what keeps the Next compile near
      # ~2.5 minutes instead of a cold 5+.
      - name: Restore Next.js build cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.platform=linux --config.architecture=x64

      # One repository secret (`ENV_FILE`) carries the whole Formbricks `.env`. It is written to a
      # real `.env`, exported into every later step, and turned into the bulk payload that
      # `wrangler secret bulk` pushes onto the Worker, so build time and runtime see the same
      # configuration: webapp/auth URLs, database, encryption and auth secrets, SMTP, S3/R2,
      # GitHub/Google/Azure/OIDC/SAML SSO, Slack/Notion/Airtable/Google Sheets, Stripe, AI provider
      # credentials, Cube, Hub, feature flags and so on.
      - name: Materialise the environment from the ENV_FILE secret
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail

          if [[ -z "${ENV_FILE}" ]]; then
            echo "::error::The ENV_FILE repository secret is empty. Paste your Formbricks .env content (WEBAPP_URL, DATABASE_URL, ENCRYPTION_KEY, BETTER_AUTH_SECRET, ...) into that single repository secret."
            exit 1
          fi

          printf '%s\n' "${ENV_FILE}" > .env

          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const workspace = process.env.GITHUB_WORKSPACE;
          const lines = fs.readFileSync(path.join(workspace, ".env"), "utf8").split(/\r?\n/);

          const entries = [];
          for (const rawLine of lines) {
            const line = rawLine.trim();
            if (line === "" || line.startsWith("#")) continue;

            const separator = line.indexOf("=");
            if (separator === -1) continue;

            const key = line.slice(0, separator).trim();
            if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(key)) continue;

            let value = line.slice(separator + 1).trim();
            const quoted =
              value.length >= 2 &&
              ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'")));
            if (quoted) value = value.slice(1, -1);

            // Skip blanks on purpose: several variables are enums, URLs or bounded numbers that
            // reject "" -- leaving one unset is fine, setting it empty fails validation at boot.
            if (value === "") continue;

            entries.push([key, value]);
          }

          if (entries.length === 0) {
            console.error("::error::ENV_FILE did not contain a single KEY=value pair.");
            process.exit(1);
          }

          // Export into every later step. The heredoc form keeps spaces, quotes and `$` intact.
          const delimiter = "__FORMBRICKS_ENV__";
          let exported = "";
          for (const [key, value] of entries) {
            exported += `${key}<<${delimiter}\n${value}\n${delimiter}\n`;
          }
          fs.appendFileSync(process.env.GITHUB_ENV, exported);

          // Bulk payloads for `wrangler secret bulk`, so the Worker receives the same values the
          // build ran with. The command accepts at most 100 secrets per call, so split into batches.
          const batchSize = 90;
          let batches = 0;
          for (let index = 0; index < entries.length; index += batchSize) {
            batches += 1;
            const batch = Object.fromEntries(entries.slice(index, index + batchSize));
            fs.writeFileSync(path.join(workspace, `.wrangler-secrets-${batches}.json`), JSON.stringify(batch));
          }
          fs.writeFileSync(path.join(workspace, ".wrangler-secret-batches"), String(batches));

          const names = entries.map(([key]) => key).sort();
          console.log(`Exported ${names.length} environment variables in ${batches} batch(es): ${names.join(", ")}`);
          NODE

      # Dev-only tooling that other workflows recreate from scratch is deliberately not part of a
      # deploy: `scripts/setup-dev-env.sh` would overwrite the secrets above with throwaway values.

      - name: Build the OpenNext Worker
        run: pnpm --filter @formbricks/web run build:cf:full

      - name: Deploy the Worker
        run: pnpm --filter @formbricks/web exec wrangler deploy

      # `wrangler deploy` does not carry secrets, so push the same configuration onto the Worker's
      # own environment. This is what OpenNext's adapter reads at request time -- build-time inlining
      # only covers NEXT_RUNTIME / NODE_ENV / TURBOPACK.
      - name: Publish environment variables to the Worker
        run: |
          set -euo pipefail

          batches_file="${GITHUB_WORKSPACE}/.wrangler-secret-batches"
          if [[ ! -s "${batches_file}" ]]; then
            echo "::notice::No environment variables to publish."
            exit 0
          fi

          batches="$(cat "${batches_file}")"
          for index in $(seq 1 "${batches}"); do
            echo "Publishing environment variables (batch ${index}/${batches})"
            pnpm --filter @formbricks/web exec wrangler secret bulk "${GITHUB_WORKSPACE}/.wrangler-secrets-${index}.json"
          done
